# Static publisher pages. Paths mirror the URLs mounted on sylphx.com.
server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;
  # Relative redirects only: the public host is sylphx.com, not this pod.
  absolute_redirect off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Strict CSP: the pages carry no script and no inline style (the app colour
  # sheet is a file), so nothing needs a nonce, a hash or 'unsafe-inline'.
  # Star badges are images from Mark. tests/site.test.ts keeps both true.
  add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src 'self'; img-src 'self' https://mark.sylphx.com; font-src 'self'; manifest-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Apple fetches this with no extension; it must be JSON and never redirect.
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    expires 1h;
    try_files $uri =404;
  }

  location = /.well-known/assetlinks.json {
    default_type application/json;
    expires 1h;
    try_files $uri =404;
  }

  location /apps/_assets/ {
    expires 1h;
    try_files $uri =404;
  }

  # A trailing slash is not a second address for a page.
  location ~ ^(/.+)/$ {
    return 301 $1;
  }

  location / {
    expires 5m;
    try_files $uri/index.html $uri =404;
  }

  error_page 404 /apps/404.html;
}
