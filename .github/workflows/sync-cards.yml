name: sync-cards

# Pulls each listed product's publisher/card.json into content/cards/ and opens
# one auto-merging pull request per changed card (README, "Adding or changing
# an app"). Runs on the free standard runner of this public repository.

on:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [card-changed]
  workflow_dispatch:
    inputs:
      only:
        description: Sync one card by slug (default: all)
        required: false

permissions:
  contents: read

concurrency:
  group: sync-cards
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Read-only on every product repository (private ones included).
      - id: source
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CARD_SYNC_APP_ID }}
          private-key: ${{ secrets.CARD_SYNC_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-metadata: read
      # Writes only here: pushes the sync branch and opens the pull request. A
      # pull request opened with the workflow's own token would not start CI,
      # so the merge queue could never see the required check.
      - id: write
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CARD_SYNC_APP_ID }}
          private-key: ${{ secrets.CARD_SYNC_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ steps.write.outputs.token }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Git identity
        run: |
          git config user.name "publisher-pages card sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Sync
        env:
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          GH_TOKEN: ${{ steps.write.outputs.token }}
          ONLY: ${{ github.event.client_payload.slug || github.event.inputs.only }}
        run: |
          set -euo pipefail
          if [ -n "${ONLY}" ]; then bun scripts/sync-cards.ts --only "${ONLY}"; else bun scripts/sync-cards.ts; fi
