name: Verify

# Post-merge verification for optimistic merge: what the merge-queue gate
# drops (the production build). Runs on each push to main and, called from
# ci.yml, on a ready pull request. The `verified` job is the marker the
# platform reads.

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      lanes:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      lanes:
        description: Comma-separated lanes to run. Empty runs every lane.
        type: string
        default: ""

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  # The marker. Named exactly `verified`; never a required check.
  verified:
    name: verified
    if: always() && !cancelled()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@054710a09ce85a2e0edbc14599bd00df0db879be # main
        with:
          needs: ${{ toJSON(needs) }}
          required: build
