name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No job selects a billed runner
        run: bash .github/scripts/check-ci-runner-profile.sh
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  # Checks the lines a pull request or merge group adds.
  zh-hant:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: SylphxAI/.github/.github/actions/zh-hant@e48f73367c3f873a1a6930c844d053ac22b32262

  # Checks the lines a pull request or merge group adds (owner standards/identifiers.md).
  identifiers:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Non-v7 ids on added lines (owner standards/identifiers.md)
        uses: SylphxAI/.github/.github/actions/identifiers@e4a5ea41cbcc87cd93914f89f0d7c3981c868bf9

  # No new departure from the default stack (docs/stack-conformance.md in
  # SylphxAI/.github): a backend service off Rust or a migration engine other
  # than atlas fails unless .github/stack-departures.txt, which may only
  # shrink, already lists it. Reads git objects only; a few seconds.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          filter: blob:none
      - uses: SylphxAI/.github/.github/actions/stack-conformance@f488fc90cda8ee46a1c3baa3f5b608aea5004786 # SylphxAI/.github#220
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}

  # The one required check (ruleset sylphx-merge-queue): the merge queue waits on this.
  ci-ok:
    if: always()
    needs: [check, zh-hant, identifiers, stack]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          set -euo pipefail
          test "${{ needs.check.result }}" = success
          test "${{ needs.stack.result }}" = success
          case "${{ needs.zh-hant.result }}" in success|skipped) ;; *) exit 1 ;; esac
          case "${{ needs.identifiers.result }}" in success|skipped) ;; *) exit 1 ;; esac
