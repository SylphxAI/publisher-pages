name: ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stop the line: while the trunk's newest conclusive Verify run is red and its
  # way back is in motion, a merge group is admitted only for a revert, a
  # live-outage fix or a pull request labelled `main-red-fix`. Observe mode
  # first; set `mode: enforce` after a few merge groups have been read.
  main-state:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/main-red-gate@a41b5ad2784fddd9854cafd216e16e104bd30d60 # main
        with:
          mode: observe

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No job selects a billed runner
        run: bash .github/scripts/check-ci-runner-profile.sh
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check

  # Checks the lines a pull request or merge group adds.
  zh-hant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: SylphxAI/.github/.github/actions/zh-hant@a41b5ad2784fddd9854cafd216e16e104bd30d60 # main
  # Discord) outside the shared allow-list: a product sends chat messages
  # through Notify (cloud ADR notify-chat-channel). Only the lines this change
  # adds are checked, and the job needs the full history to see them.
  chat-senders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: SylphxAI/.github/.github/actions/chat-senders@a41b5ad2784fddd9854cafd216e16e104bd30d60 # main
        with:
          mode: fail

  # Checks the lines a pull request or merge group adds (owner standards/identifiers.md).
  identifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Non-v7 ids on added lines (owner standards/identifiers.md)
        uses: SylphxAI/.github/.github/actions/identifiers@a41b5ad2784fddd9854cafd216e16e104bd30d60 # main
  # after merge verify.yml runs it on the trunk. Never in a merge group or a draft.
  suite:
    if: github.event_name != 'merge_group' && !github.event.pull_request.draft
    uses: ./.github/workflows/verify.yml

  # No new departure from the default stack (docs/stack-conformance.md in
  # SylphxAI/.github): a backend service off Rust or a migration engine other
  # than atlas fails unless .github/stack-departures.txt, which may only
  # shrink, already lists it. Reads git objects only; a few seconds.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          filter: blob:none
      - uses: SylphxAI/.github/.github/actions/stack-conformance@a41b5ad2784fddd9854cafd216e16e104bd30d60 # main
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}

  # The one required check (ruleset sylphx-merge-queue): the merge queue waits on this.
  ci-ok:
    if: always() && !cancelled()
    needs: [main-state, check, zh-hant, identifiers, chat-senders, stack, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@a41b5ad2784fddd9854cafd216e16e104bd30d60 # main
        with:
          needs: ${{ toJSON(needs) }}
          required: check,zh-hant,identifiers,chat-senders,stack
          required-unless-merge-group: ${{ github.event.pull_request.draft && ' ' || 'suite' }}
