name: ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  # Stop the line: while the trunk's newest conclusive Verify run is red and its
  # way back is in motion, a merge group is admitted only for a revert, a
  # live-outage fix or a pull request labelled `main-red-fix`. Observe mode
  # first; set `mode: enforce` after a few merge groups have been read.
  main-state:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/main-red-gate@05ac6474b96425bcb4965addd025a93e061b66c4
        with:
          mode: observe

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No job selects a billed runner
        run: bash .github/scripts/check-ci-runner-profile.sh
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check

  # Checks the lines a pull request or merge group adds.
  zh-hant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: SylphxAI/.github/.github/actions/zh-hant@e48f73367c3f873a1a6930c844d053ac22b32262

  # Checks the lines a pull request or merge group adds (owner standards/identifiers.md).
  identifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Non-v7 ids on added lines (owner standards/identifiers.md)
        uses: SylphxAI/.github/.github/actions/identifiers@e4a5ea41cbcc87cd93914f89f0d7c3981c868bf9

  # The full suite (the production build) on a pull request that is ready;
  # after merge verify.yml runs it on the trunk. Never in a merge group or a draft.
  suite:
    if: github.event_name != 'merge_group' && !github.event.pull_request.draft
    uses: ./.github/workflows/verify.yml

  # The one required check (ruleset sylphx-merge-queue): the merge queue waits on this.
  ci-ok:
    if: always()
    needs: [main-state, check, zh-hant, identifiers, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@05ac6474b96425bcb4965addd025a93e061b66c4
        with:
          needs: ${{ toJSON(needs) }}
          required: check,zh-hant,identifiers
          required-unless-merge-group: ${{ github.event.pull_request.draft && ' ' || 'suite' }}
