# Sylphx publisher pages: sylphx.com/apps. Platform serves the app-link files.
version = "1"

[project]
name = "publisher-pages"
description = "Publisher pages for apps published by Sylphx"

[build]
strategy = "dockerfile"
dockerfile = "Dockerfile"
context = "."

[[services]]
name = "web"
port = 8080
# micro (0.25 CPU, 512 MiB): 7-day p95 0.07 GiB, peak 0.07 GiB, CPU p95 0.000 (read 2026-10-04). Not nano: a nano revision of this service did not become ready on 2026-10-03.
instance_type = "micro"
public_networking = true

[services.health]
mode = "http"
path = "/healthz"

# Supported domain-level path mount (SylphxAI/cloud#9128).
# The platform retains /, /open-source and both /.well-known app-link files.
[[domains]]
hostname = "sylphx.com"
service = "web"
paths = ["/apps"]
