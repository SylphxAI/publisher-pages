# Sylphx publisher pages: sylphx.com/apps and the app-link files.
version = "1"

[project]
name = "publisher-pages"
description = "Publisher pages for apps published by Sylphx"

[build]
strategy = "dockerfile"
dockerfile = "Dockerfile"
context = "."

[[services]]
name = "web"
port = 8080
# nano (0.1 CPU, 256 MiB): 7-day p95 0.07 GiB, peak 0.07 GiB, CPU p95 0.000 (read 2026-10-04).
instance_type = "nano"
public_networking = true

[services.health]
mode = "http"
path = "/healthz"
