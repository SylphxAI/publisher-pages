# Sylphx publisher pages: sylphx.com/apps and the app-link files.
version = "1"

[project]
name = "publisher-pages"
description = "Publisher pages for apps published by Sylphx"

[build]
strategy = "dockerfile"
dockerfile = "Dockerfile"
context = "."

[[services]]
name = "web"
port = 8080
public_networking = true

[services.health]
mode = "http"
path = "/healthz"

# Mount on the apex host next to the platform's own catch-all: only these paths
# come here. Takes effect once the platform admits path-scoped domains on
# sylphx.com (cloud#9128) and lists /open-source with /apps.
[[environments.production.domains]]
hostname = "sylphx.com"
service = "web"
paths = ["/apps", "/open-source", "/.well-known/apple-app-site-association", "/.well-known/assetlinks.json"]
